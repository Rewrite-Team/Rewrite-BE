spring:
  application:
    name: rewrite

  profiles:
    # 세부 프로필 역할
    # - db-h2: 로컬 파일 H2 데이터베이스와 H2 Console을 사용한다.
    # - db-postgres: PostgreSQL 접속 환경변수, 드라이버와 공통 JPA 설정을 사용한다.
    # - auth-dev: 인증을 생략하고 고정된 개발 사용자로 요청을 처리한다.
    # - auth-real: JWT와 Kakao OAuth 기반의 실제 인증 기능을 활성화한다.
    # - internal-tools-secured: Swagger UI와 OpenAPI 문서를 Basic Auth로 보호한다.
    group:
      # 기본 로컬 개발 환경: Docker 없이 H2와 개발용 인증을 사용한다.
      local:
        - db-h2
        - auth-dev
      # 로컬 PostgreSQL 개발 환경: Docker PostgreSQL과 개발용 인증을 사용한다.
      local-postgres:
        - db-postgres
        - auth-dev
      # 운영 환경: PostgreSQL, 실제 사용자 인증, 내부 도구 보호를 모두 활성화한다.
      prod:
        - db-postgres
        - auth-real
        - internal-tools-secured
      # 일반 자동화 테스트 환경: 테스트 전용 H2 설정과 개발용 인증을 사용한다.
      test:
        - auth-dev
      # 실제 인증 흐름 통합 테스트 환경: 실제 인증과 내부 도구 보호를 검증한다.
      auth-test:
        - auth-real
        - internal-tools-secured

  datasource:
    embedded-database-connection: none

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false
      path: /h2-console

  ai:
    retry:
      max-attempts: 1
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-nano  # GPT-5 models do not support temperature parameter
          temperature: 1 # temperature 미 설정 시 기본값 0.7 이 들어가면서 error 발생. 해당 모델은 temperature: 1 만 가능

rewrite:
  internal-tools:
    username: ${INTERNAL_TOOLS_USERNAME:0000}
    password: ${INTERNAL_TOOLS_PASSWORD:0000}
  auth:
    issuer: rewrite
    audience: rewrite-web
    jwt-secret-base64: ${AUTH_JWT_SECRET_BASE64:}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
    frontend-success-url: ${FRONTEND_SUCCESS_URL:http://localhost:3000}
    frontend-login-url: ${FRONTEND_LOGIN_URL:http://localhost:3000/login}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/auth/kakao/callback}
      authorize-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me

springdoc:
  swagger-ui:
    filter: true  # swagger UI 상단에 검색 입력창 표시
    doc-expansion: none # 처음 swagger UI를 열었을 때 모든 도메인과 API를 접힌 상태로 표시
    tags-sorter: alpha  # 인증, 자기소개서, 첨삭 버전 과 같은 도메인 태그를 이름순(오름차순) 정렬 (controller 선언순서에 영향받지 않음)
    operations-sorter: alpha  # 각 태그 안의 API를 알파벡순으로 정렬 (controller에 작성된 순서가 아니라 경로 문자열 기준 오름차순 배치)
