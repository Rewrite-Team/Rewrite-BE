spring:
  application:
    name: rewrite

  datasource:
    url: jdbc:h2:file:./data/rewrite;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false
      path: /h2-console

  ai:
    retry:
      max-attempts: 1
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-nano  # GPT-5 models do not support temperature parameter
          temperature: 1 # temperature 미 설정 시 기본값 0.7 이 들어가면서 error 발생. 해당 모델은 temperature: 1 만 가능

rewrite:
  internal-tools:
    username: ${INTERNAL_TOOLS_USERNAME:0000}
    password: ${INTERNAL_TOOLS_PASSWORD:0000}
  auth:
    issuer: rewrite
    audience: rewrite-web
    jwt-secret-base64: ${AUTH_JWT_SECRET_BASE64:}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
    frontend-success-url: ${FRONTEND_SUCCESS_URL:http://localhost:3000}
    frontend-login-url: ${FRONTEND_LOGIN_URL:http://localhost:3000/login}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/auth/kakao/callback}
      authorize-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me

springdoc:
  swagger-ui:
    filter: true  # swagger UI 상단에 검색 입력창 표시
    doc-expansion: none # 처음 swagger UI를 열었을 때 모든 도메인과 API를 접힌 상태로 표시
    tags-sorter: alpha  # 인증, 자기소개서, 첨삭 버전 과 같은 도메인 태그를 이름순(오름차순) 정렬 (controller 선언순서에 영향받지 않음)
    operations-sorter: alpha  # 각 태그 안의 API를 알파벡순으로 정렬 (controller에 작성된 순서가 아니라 경로 문자열 기준 오름차순 배치)
