spring:
  application:
    name: rewrite

  profiles:
    # 실행 목적별 group이 DB와 인증 세부 profile을 조합한다.
    # - db-h2: 로컬 파일 H2 데이터베이스와 H2 Console을 사용한다.
    # - db-postgres: PostgreSQL 접속 환경변수, 드라이버와 JPA schema 갱신 설정을 사용한다.
    # - auth-dev: 인증을 생략하고 고정된 개발 사용자로 요청을 처리한다.
    # - auth-real: JWT와 Kakao OAuth 기반의 실제 인증 기능을 활성화한다.
    group:
      # 기본 로컬 개발 환경: Docker 없이 H2와 개발용 인증을 사용한다.
      local:
        - db-h2
        - auth-dev
      # 로컬 PostgreSQL 개발 환경: Docker PostgreSQL과 개발용 인증을 사용한다.
      local-postgres:
        - db-postgres
        - auth-dev
      # 운영 환경: PostgreSQL과 실제 사용자 인증을 활성화한다.
      prod:
        - db-postgres
        - auth-real
      # 일반 자동화 테스트 환경: 테스트 전용 H2 설정과 개발용 인증을 사용한다.
      test:
        - auth-dev
      # 인증 통합 테스트 환경: auth-real을 켜고 테스트 전용 DB·JWT 설정을 사용한다.
      auth-test:
        - auth-real

  datasource:
    # profile의 접속 정보 없이 내장 H2가 자동 선택되지 않도록 한다.
    embedded-database-connection: none

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      # 기본은 비활성화하며 application-db-h2.yaml에서 활성화한다.
      enabled: false
      path: /h2-console

  ai:
    retry:
      # Spring AI 호출 계층의 시도 횟수이며 Job Runner의 문항 재시도 정책과 별개다.
      max-attempts: 1
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-nano
          # 호출 옵션을 명시해 라이브러리의 기본 temperature 설정에 의존하지 않는다.
          temperature: 1

rewrite:
  # db-h2의 콘솔 Basic Auth에 사용하며 환경변수를 생략하면 로컬 기본 계정을 적용한다.
  internal-tools:
    username: ${INTERNAL_TOOLS_USERNAME:0000}
    password: ${INTERNAL_TOOLS_PASSWORD:0000}
  auth:
    issuer: rewrite
    audience: rewrite-web
    jwt-secret-base64: ${AUTH_JWT_SECRET_BASE64:}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
    frontend-success-url: ${FRONTEND_SUCCESS_URL:http://localhost:3000/writing}
    frontend-login-url: ${FRONTEND_LOGIN_URL:http://localhost:3000/login}
    local-frontend-origin: ${LOCAL_FRONTEND_ORIGIN:http://localhost:3000}
    local-frontend-success-url: ${LOCAL_FRONTEND_SUCCESS_URL:http://localhost:3000/writing}
    local-frontend-login-url: ${LOCAL_FRONTEND_LOGIN_URL:http://localhost:3000/login}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/auth/kakao/callback}
      authorize-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me

springdoc:
  swagger-ui:
    filter: true  # 상단 검색 입력창 표시
    doc-expansion: none # 첫 진입 시 태그와 API를 접어서 표시
    tags-sorter: alpha  # 태그 이름순 정렬
    operations-sorter: alpha  # 각 태그 안의 API 경로순 정렬
