# test group은 auth-dev를 활성화하고 이 파일은 테스트 전용 인메모리 DB와 외부 AI 설정용 값을 제공한다.
# PostgreSQL 호환 모드 H2를 사용하며 context 생성·종료 시 schema를 만들고 삭제한다.
spring:

  datasource:
    url: jdbc:h2:mem:rewrite-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

  ai:
    retry:
      max-attempts: 1
    openai:
      api-key: test-key
      chat:
        options:
          model: gpt-5-nano
          # 애플리케이션과 같은 호출 옵션을 명시한다. 실제 외부 호출 대체는 각 테스트의 mock이 담당한다.
          temperature: 1
