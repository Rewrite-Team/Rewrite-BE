name: Backend CI

on:
  push:
    branches:
      - dev     # dev 브랜치에 직접 push 될 때 실행
  pull_request:
    branches:
      - dev     # PR 대상 프랜치가 dev 일 때 실행

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

