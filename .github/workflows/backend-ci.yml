name: Backend CI  # GitHub Actions 화면에 표시할 전체 워크플로우 이름

on:
  pull_request:
    branches:
      - dev # dev를 대상으로 하는 PR에서 실행, 열린 PR에 커밋을 추가로 push 하면 PR이 갱신되면서 CI도 다시 실행됨

# GitHub Actions 는 실행할 때 임시 GITHUB_TOKEN을 받는다. 해당 토큰을 사용하면 설정에 따라 저장소를 읽거나 수정할 수 있다.
permissions:
  contents: read  # 저장소 내용 읽기 허용

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}   # PR 번호가 있으면 PR 번호 사용, 없으면 Git 브랜치 ref 사용
  cancel-in-progress: true  # PR에 커밋을 연속으로 push 하는 상황에서 첫번째 CI는 오래된 코드를 검증하고 있으므로 계속 실행할 필요 없음. 따라서 첫 번째 실행을 취소하고 최신 실행만 유지

jobs:
  check:
    name: Backend Check # 워크플로우 안에서 실행되는 job 이름
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6  # 현재 검증할 커밋을 임시 컴퓨터로 가져옴(checkout)
        with:
          persist-credentials: false  # checkout 과정에서 사용한 GitHub 인증 정보를 Git 설정에 남기지 않음

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3   # Gradle실행환경을 준비하고, Gradle이 다운로드한 의존성 등을 캐시하여 이후 CI 실행 시간을 줄임

      - name: Run checks
        run: ./gradlew check

      - name: Upload test report
        if: always()  # Run checks 가 실패하더라도 리포트 업로드 시도
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 # GitHub Actions에서 테스트 결과 파일을 업로드하는 공식 Action
        with:
          name: backend-test-report   # GitHub Actions 실행 결과에서 다운로드할 artifact 이름
          path: build/reports/tests/test  # 업로드할 디렉터리
          if-no-files-found: warn   # 업로드 대상 파일이 없을 때 업로드 step 자체를 실패시키지 않고 경고
          retention-days: 14    # artifact를 GitHub에 14일간 보관

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jacoco-report   # artifact 이름
          path: build/reports/jacoco/test
          if-no-files-found: warn
          retention-days: 14
