# local-postgres 개발용 DB다. 애플리케이션은 DB_URL·DB_USERNAME·DB_PASSWORD로 이 DB에 접속한다.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rewrite
      POSTGRES_USER: qwer
      POSTGRES_PASSWORD: qwer
    # 호스트의 로컬 인터페이스에서만 PostgreSQL 포트를 연다.
    ports:
      - "127.0.0.1:5432:5432"
    # 계정 초기화 값은 빈 데이터 디렉터리에만 적용된다. 컨테이너를 다시 만들어도 이 volume은 남는다.
    volumes:
      - rewrite-postgres-data:/var/lib/postgresql/data
    # $$는 Compose의 변수 치환을 피하고 컨테이너 안의 환경변수로 평가되게 한다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  rewrite-postgres-data:
    name: rewrite-postgres-data
