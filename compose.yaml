services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rewrite
      POSTGRES_USER: qwer
      POSTGRES_PASSWORD: qwer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rewrite-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  rewrite-postgres-data:
    name: rewrite-postgres-data
